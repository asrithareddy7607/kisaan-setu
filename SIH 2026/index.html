          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          if (type === 'success') {
            osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
            osc.start();
            osc.stop(ctx.currentTime + 0.4);
          } else if (type === 'alert') {
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);

        sendSmsNotification(`Quality Inspection Done! Token ${activeToken?.number || 'KS-2026-IKP-0482'}: Moisture recorded at ${inspectMoisture}% (FAQ limit ≤17%). FAQ Grade: ${inspectFaqGrade}. Approved for Weighbridge.`);
        playChime('success');
      };

      // Officer: Complete Weighing & Final Procurement Receipt
      const handleOfficerCompleteProcurement = () => {
        const net = (parseFloat(weighGross) - parseFloat(weighTare)).toFixed(2);
        setWeighNet(net);
        setProcurementStage(8); // Stage 8: Procured
        const cropObj = CROPS_DATA.find(x => x.id === selectedCropId) || CROPS_DATA[0];
        const grossPay = (net * cropObj.msp).toFixed(2);
        const receiptNo = `WSP-2026-TG-${Math.floor(10000 + Math.random() * 90000)}`;

        sendSmsNotification(`Procurement Completed! Weight Slip ${receiptNo} generated. Net Weight: ${net} Quintals (${weighBags} Bags). Gross Payable Amount: ₹${Number(grossPay).toLocaleString('en-IN')}. Sent for DBT Disbursement.`);
        playChime('success');

        // Automatically simulate DBT payment processing -> Paid in 4 seconds
        setTimeout(() => {
          setProcurementStage(10); // Paid via DBT
          const utr = `DBT${Math.floor(100000000000 + Math.random() * 900000000000)}`;
          sendSmsNotification(`🎉 PAYMENT CREDITED: ₹${Number(grossPay).toLocaleString('en-IN')} deposited into Bank A/C ending in ${farmerProfile.bankAccountMask} (${farmerProfile.bankName}). Bank UTR: ${utr}. KisanSetu thanks you!`);
          playChime('success');
        }, 4500);
      };

      // Web Speech Voice Assistant Logic
      const handleToggleVoiceAssistant = () => {
        if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
          alert('Web Speech API is not supported in this browser. Please try Chrome, Edge, or Android Chrome.');
          return;
        }

        if (isVoiceActive) {
          setIsVoiceActive(false);
          return;
        }

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRec();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = lang === 'te' ? 'te-IN' : lang === 'hi' ? 'hi-IN' : 'en-IN';

        setIsVoiceActive(true);
        setVoiceTranscript('Listening...');

        recognition.onstart = () => {
          setVoiceFeedback('Listening to your query in ' + (lang === 'te' ? 'Telugu' : lang === 'hi' ? 'Hindi' : 'English') + '...');
        };

        recognition.onresult = (event) => {
          const spoken = event.results[0][0].transcript.toLowerCase();
          setVoiceTranscript(`"${spoken}"`);
          handleProcessVoiceCommand(spoken);
        };

        recognition.onerror = (err) => {
          console.error('Speech recognition error:', err);
          setIsVoiceActive(false);
          setVoiceFeedback('Voice recognition error or cancelled.');
        };

        recognition.onend = () => {
          setIsVoiceActive(false);
        };

        recognition.start();
      };

      // Process Spoken Voice Commands
      const handleProcessVoiceCommand = (query) => {
        let answer = '';
        if (query.includes('token') || query.includes('టోకెన్') || query.includes('टोकन')) {
          if (activeToken) {
            answer = `Your token number is ${activeToken.number}. You are booked at ${activeToken.centreName} for slot ${activeToken.slot}.`;
          } else {
            answer = `You do not have an active token yet. Please complete crop registration and schedule your slot.`;
          }
        } else if (query.includes('ahead') || query.includes('ముందు') || query.includes('आगे') || query.includes('how many')) {
          if (activeToken) {
            answer = `There are currently ${activeToken.farmersAhead} farmers ahead of you. Estimated wait time is approximately ${activeToken.estimatedWaitMins} minutes.`;
          } else {
            answer = `Currently, the nearest IKP centre at Warangal Rural has 4 farmers waiting in queue.`;
          }
        } else if (query.includes('centre') || query.includes('center') || query.includes('కేంద్రం') || query.includes('केंद्र') || query.includes('nearest')) {
          const nearest = centres[0];
          answer = `The nearest centre is ${nearest.name}, which is ${nearest.distanceKm} kilometers away with a wait time of ${nearest.avgProcessingMins} minutes.`;
        } else if (query.includes('status') || query.includes('స్థితి') || query.includes('स्थिति') || query.includes('procurement')) {
          const stageNames = [
            'Registered', 'Passbook Verified', 'Produce Registered', 'Token Generated', 
            'Arrived at Gate', 'Quality Check Done', 'Weighed', 'Procurement Complete', 'Payment Processing', 'Paid via DBT'
          ];
          answer = `Your procurement is currently at stage ${procurementStage}: ${stageNames[procurementStage - 1]}.`;
        } else if (query.includes('schedule') || query.includes('షెడ్యూల్') || query.includes('शेड्यूल')) {
          answer = `Today's procurement centres are open from 8:00 AM to 6:00 PM. Next available slot is at 11:30 AM at Warangal Rural IKP Centre.`;
        } else {
          answer = `I heard: ${query}. At KisanSetu, you can ask about your token, queue wait time, nearby IKP centres, or procurement payment status.`;
        }

        setVoiceFeedback(answer);
        speakResponse(answer);
      };

      // KisanSetu AI Assistant Query Responder
      const handleSendAiMessage = () => {
        if (!aiInputText.trim()) return;
        const userQ = aiInputText.trim();
        const newMsg = { sender: 'user', text: userQ, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
        setAiMessages(prev => [...prev, newMsg]);
        setAiInputText('');

        setTimeout(() => {
          let botReply = '';
          const q = userQ.toLowerCase();
          if (q.includes('token') || q.includes('queue') || q.includes('wait') || q.includes('ahead')) {
            if (activeToken) {
              botReply = `Your token ${activeToken.number} is scheduled at ${activeToken.centreName}. Current position: ${activeToken.farmersAhead} farmers ahead of you. Est. wait: ~${activeToken.estimatedWaitMins} mins. Arrival recommendation: Arrive 15 minutes before your slot with vehicle ${activeToken.vehicleNumber}.`;
            } else {
              botReply = `You haven't generated a token yet. Ensure your Pattadar Passbook is authenticated, register your produce quantity, and pick a slot to receive a digital QR token.`;
            }
          } else if (q.includes('msp') || q.includes('price') || q.includes('rate')) {
            const cropObj = CROPS_DATA.find(x => x.id === selectedCropId) || CROPS_DATA[0];
            botReply = `Official MSP for ${cropObj.name} is ₹${cropObj.msp} per quintal. Max permissible moisture is ${cropObj.maxMoisture}%. Total estimated valuation for your ${cropQuantityQtl} quintals is ₹${(cropQuantityQtl * cropObj.msp).toLocaleString('en-IN')}.`;
          } else if (q.includes('ikp') || q.includes('centre') || q.includes('center')) {
            botReply = `We have 6 active centres in this district including Warangal Rural IKP Centre (4.2 km), Suryapet FCI Godown (12.8 km), and Miryalaguda IKP Centre (7.9 km). Warangal Rural IKP is recommended for having the shortest live queue.`;
          } else if (q.includes('moisture') || q.includes('quality') || q.includes('faq')) {
            botReply = `Under Fair Average Quality (FAQ) guidelines, Paddy moisture must be 17.0% or below. Moisture above 17% attracts a pro-rata weight deduction or requires shade drying before weighing.`;
          } else if (q.includes('payment') || q.includes('dbt') || q.includes('money') || q.includes('account')) {
            botReply = `Payments are routed directly to your Aadhaar-linked Bank Account (${farmerProfile.bankAccountMask}, ${farmerProfile.bankName}) via Direct Benefit Transfer (DBT) within 24 to 48 hours of digital weight slip generation.`;
          } else {
            botReply = `KisanSetu connects you directly to government mandis and local IKP self-help group centres with real-time queue tokens, eliminating overnight wait times and unauthorized middleman cuts. You can ask me about your active token, nearest centre, or payment status.`;
          }

          setAiMessages(prev => [...prev, {
            sender: 'ai',
            text: botReply,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }]);
          playChime('success');
        }, 600);
      };

      // Leaflet Map Initialization and Pinning
      useEffect(() => {
        if ((activeRoute === '/farmer/centres' || activeRoute === '/farmer') && mapContainerRef.current) {
          if (!mapInstanceRef.current) {
            const map = L.map(mapContainerRef.current).setView([17.9689, 79.5941], 10);

                  </div>
                </div>
              `);

        };

                    >
                      EN
                    </button>
                    <button 
                      onClick={() => setLang('te')}

                    >
                      తెలుగు
                    </button>
                    <button 
                      onClick={() => setLang('hi')}
                      className={`px-2.5 py-1 rounded font-medium transition ${lang === 'hi' ? 'bg-farmer-600 text-white font-bold shadow' : 'text-emerald-200 hover:text-white'}`}
                    >
                      हिंदी
                    </button>
                  </div>

                  {/* SMS Drawer Button with Badge */}
                  <button 
                    onClick={() => setShowSmsModal(true)}
                    className="relative bg-farmer-800 hover:bg-farmer-700 p-2 rounded-lg text-emerald-100 transition border border-farmer-700 flex items-center gap-1.5 text-xs font-semibold"
                    title="Simulated SMS Drawer"
                  >
                    <i data-lucide="message-square" className="w-4 h-4 text-amber-300"></i>
                    <span className="hidden md:inline">SMS</span>
                    <span className="w-2 h-2 rounded-full bg-amber-400 absolute -top-1 -right-1"></span>

                    >

                  {/* Mobile Role Switch Button */}

                      Farmer Login

              </div>
            </div>
          </header>

          {/* VOICE & AI FLOATING ACTION BAR (BOTTOM RIGHT) */}
          <div className="fixed bottom-5 right-5 z-50 flex flex-col items-end gap-2.5 pointer-events-auto">
            {/* AI Assistant Drawer Button */}
            <button
              onClick={() => setShowAiDrawer(true)}
              className="bg-farmer-800 hover:bg-farmer-700 text-white font-bold px-3.5 py-2 rounded-full shadow-xl border border-farmer-600 flex items-center gap-2 text-xs transition transform hover:scale-105 active:scale-95"
            >
              <div className="w-6 h-6 rounded-full bg-amber-400 text-slate-900 flex items-center justify-center font-bold">

            {/* Voice Assistant Mic Button */}

          {/* VOICE FEEDBACK OVERLAY BANNER */}

          {/* MAIN VIEW CONTENT CONTAINER */}
          <main className="flex-1">
            
            {/* ========================================================================= */}

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    
                    {/* Transformation 1 */}
